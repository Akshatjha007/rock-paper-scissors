<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    .btn { font-size: 18px; padding: 10px 20px; margin: 8px; cursor: pointer; border-radius: 8px; border: 1px solid #ccc; }
    .scores { font-size: 20px; margin: 20px 0; font-weight: bold; }
    #result { font-size: 22px; font-weight: bold; margin: 20px 0; }
  </style>
</head>
<body>

  <div class="box">
    <h2 id="welcome"></h2>
    <h1>🎮 Rock Paper Scissors</h1>
  </div>

  <!-- Buttons for game options -->
  <div class="choices">
    <button class="btn" onclick="play('Rock')">🪨 Rock</button>
    <button class="btn" onclick="play('Paper')">📄 Paper</button>
    <button class="btn" onclick="play('Scissors')">✂️ Scissors</button>
  </div>

  <!-- Score Board -->
  <div class="scores">
    <p>You: <span id="you">0</span> | Computer: <span id="cpu">0</span></p>
  </div>

  <!-- Result Display Area -->
  <div id="result"></div>

  <!-- Reset Button -->
  <button class="btn" onclick="resetGame()">🔄 Reset Game</button>

  <script>
    // Player name prompt and Welcome message
    let playerName = prompt("Enter Your Name");
    if (playerName == null || playerName.trim() === "") {
      playerName = "Player";
    }
    document.getElementById("welcome").innerHTML = "👋 Welcome " + playerName;

    // Score counter variables
    let you = 0;
    let cpu = 0;

    // Play function
    function play(user) {
      let arr = ["Rock", "Paper", "Scissors"];
      let computer = arr[Math.floor(Math.random() * 3)];
      let result = "";

      if (user === computer) {
        result = "🤝 Draw";
      } else if (
        (user === "Rock" && computer === "Scissors") ||
        (user === "Paper" && computer === "Rock") ||
        (user === "Scissors" && computer === "Paper")
      ) {
        result = "🎉 You Win!";
        you++;
      } else {
        result = "💻 Computer Wins!";
        cpu++;
      }

      document.getElementById("result").innerHTML =
        "You chose: <b>" + user + "</b><br>Computer chose: <b>" + computer + "</b><br><br>" + result;
      document.getElementById("you").innerText = you;
      document.getElementById("cpu").innerText = cpu;
    }

    // Reset function
    function resetGame() {
      you = 0;
      cpu = 0;
      document.getElementById("you").innerText = 0;
      document.getElementById("cpu").innerText = 0;
      document.getElementById("result").innerText = "";
    }
  </script>

</body>
</html>
