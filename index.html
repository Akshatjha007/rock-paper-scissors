<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
</head>
<body>

  <div class="box">
    <h2 id="welcome"></h2>
    <h1>🎮 Rock Paper Scissors</h1>
  </div>

  <!-- Note: Aapke Rock/Paper/Scissors buttons aur Result/Score IDs (<span id="you">, <span id="cpu">, <div id="result">) yahan rahenge -->

  <script>
    // Player name prompt and Welcome message
    let playerName = prompt("Enter Your Name");
    if (playerName == null || playerName.trim() == "") {
      playerName = "Player";
    }
    document.getElementById("welcome").innerHTML = "👋 Welcome " + playerName;

    // Score counter variables
    let you = 0;
    let cpu = 0;

    // Play function
    function play(user) {
      let arr = ["Rock", "Paper", "Scissors"];
      let computer = arr[Math.floor(Math.random() * 3)];
      let result = "";

      if (user == computer) {
        result = "🤝 Draw";
      } else if (
        (user == "Rock" && computer == "Scissors") ||
        (user == "Paper" && computer == "Rock") ||
        (user == "Scissors" && computer == "Paper")
      ) {
        result = "🎉 You Win!";
        you++;
      } else {
        result = "💻 Computer Wins!";
        cpu++;
      }

      document.getElementById("result").innerHTML =
        "You: " + user + "<br>Computer: " + computer + "<br><br>" + result;
      document.getElementById("you").innerText = you;
      document.getElementById("cpu").innerText = cpu;
    }

    // Reset function
    function resetGame() {
      you = 0;
      cpu = 0;
      document.getElementById("you").innerText = 0;
      document.getElementById("cpu").innerText = 0;
      document.getElementById("result").innerText = "";
    }
  </script>

</body>
</html>
